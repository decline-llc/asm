[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asm-workbench"
version = "0.1.0"
description = "Windows orchestration and WSL tools for authorized attack surface inventory"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "click>=8.1,<9", "PyYAML>=6,<7", "python-dotenv>=1,<2",
  "httpx>=0.27,<1", "dnspython>=2.6,<3", "openpyxl>=3.1,<4",
  "tldextract>=5.1,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "build>=1,<2", "requests>=2.31,<3"]
browser = ["playwright>=1.49,<2"]

[project.scripts]
asm = "asm.cli:main"

[tool.setuptools.packages.find]
include = ["asm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["wsl: requires a real WSL distribution", "live: requires explicit live credentials",
           "slow: actual 15-second quota timing", "browser: installed Playwright Chromium"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
